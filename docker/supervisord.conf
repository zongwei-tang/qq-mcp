[unix_http_server]
file=/tmp/supervisor.sock
chmod=0777

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:snowluma]
command=/usr/local/bin/node --import /app/qq-launcher.mjs /app/snowluma/index.mjs
directory=%(ENV_SNOWLUMA_DATA)s
user=qq
priority=20
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/app",DISPLAY="%(ENV_DISPLAY)s",XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",SNOWLUMA_HOOK_RUNTIME_DIR="%(ENV_SNOWLUMA_HOOK_RUNTIME_DIR)s",SNOWLUMA_LOG_LEVEL="%(ENV_SNOWLUMA_LOG_LEVEL)s",SNOWLUMA_HOOK_AUTOLOAD="%(ENV_SNOWLUMA_HOOK_AUTOLOAD)s"

[program:qq-mcp]
command=/usr/local/bin/node /app/qq-mcp/dist/index.js serve
directory=/app/qq-mcp
user=qq
priority=30
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/app",DISPLAY="%(ENV_DISPLAY)s"
